<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="lavish-annotation-mode" content="off" />
    <title>George Showroom Whiteboard</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f7f4ec;
        color: #17130a;
      }
      body {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        min-height: calc(100vh - 2px);
        padding: 1px;
      }
      .mermaid {
        width: 100%;
        min-height: calc(100vh - 2px);
        display: grid;
        place-items: center;
      }
    </style>
  </head>
  <body>
    <main>
      <pre class="mermaid">
flowchart TD
  ROOT["UNTITLED WHITEBOARD"] --> FIRST["First branch"]
  ROOT --> SECOND["Second branch"]
  </pre
      >
    </main>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.15.0/dist/mermaid.esm.min.mjs";
      mermaid.initialize({
        startOnLoad: true,
        theme: "neutral",
        securityLevel: "strict",
        flowchart: { curve: "basis", nodeSpacing: 48, rankSpacing: 72 },
      });
    </script>
  </body>
</html>
